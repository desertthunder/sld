# Checks pull requests once they are ready for review, and every push to main.
# Agents run `make ci` before each push, so a draft starts no job, `ci`
# included: a skipped required check counts as passing, which is safe only
# because a draft cannot merge.
#
# `changes` filters paths. `web` runs lint, check, the unit tests and the build,
# `e2e` runs the Chromium browser tests in three shards at once, and `devtools`
# runs the devtools steps; each skips when its paths didn't change. The browser
# tests ran past the time limit in one job, so they shard. `ci`, the only
# required status check, waits for every job and passes only if each one passed
# or was skipped by the path filter. It runs even when a job before it fails or
# is cancelled, because a skipped `ci` would count as passing.
#
# The browser tests run in Chromium only. Browsers (browsers.yml) runs them in
# Firefox or WebKit when a pull request carries that label. `ci` never runs on
# a label event: a label would start a run that skips, and a skipped `ci`
# counts as passing even after a failed run on the same head.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      devtools: ${{ steps.filter.outputs.devtools }}
    steps:
      - uses: actions/checkout@v5
      # On a pull request this reads the pull request's files; on a push to
      # main it compares against the commit before the push.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared_ts: &shared_ts
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - .nvmrc
              - eslint.config.js
              - prettier.config.js
              - .prettierignore
              - .github/workflows/ci.yml
              - Makefile
            web:
              - apps/web/**
              - *shared_ts
            devtools:
              - tools/devtools/**
              - .github/workflows/comment.yml
              - *shared_ts

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Web lint
        run: pnpm exec prettier --check apps/web && pnpm exec eslint apps/web
      - name: Web check
        run: pnpm --filter @sld/web check
      - name: Web test
        run: pnpm --filter @sld/web test
      - name: Web build
        run: pnpm --filter @sld/web build
      - name: Check the build serves the app shell for every path
        run: make app-shell

  e2e:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    name: e2e (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Let every shard finish, so one run lists every failing browser test.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Key the browser cache by Playwright version
        id: browsers
        run: |
          version=$(pnpm --filter @sld/web exec playwright --version | awk '{ print $2 }')
          echo "cache-key=playwright-$ImageOS-$version-chromium" >> "$GITHUB_OUTPUT"
      - name: Restore Chromium from the cache
        id: browser-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-key }}
      - name: Install Chromium and its system packages
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @sld/web exec playwright install --with-deps chromium
      # Saved before the tests run, so a failing test doesn't cost the next run the download. Shards that miss the cache
      # together all try to save it, and only the first can.
      - name: Save Chromium to the cache
        if: steps.browser-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-key }}
      - name: Install the system packages the cached Chromium needs
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @sld/web exec playwright install-deps chromium
      # Playwright shards a file whole unless its tests may run apart, and the editor's file holds about 40% of the
      # suite's time. The runner has 2 vCPUs, so each shard keeps one worker.
      - name: Web browser test
        run: pnpm --filter @sld/web e2e --project=chromium --workers=1 --fully-parallel --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  devtools:
    needs: changes
    if: needs.changes.outputs.devtools == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        id: install
      # Run after a failed devtools step too, so one run reports every failure.
      - name: Devtools lint
        run: pnpm exec prettier --check tools/devtools && pnpm exec eslint tools/devtools
      - name: Devtools check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @sld/devtools check
      - name: Devtools test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @sld/devtools test
      - name: Dry run as comment.yml does
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: make dry-run

  ci:
    needs: [changes, web, e2e, devtools]
    # always() keeps a failed or cancelled job from skipping `ci`.
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every job passed, or was skipped by the path filter
        env:
          CHANGES: ${{ needs.changes.result }}
          WEB_CHANGED: ${{ needs.changes.outputs.web }}
          DEVTOOLS_CHANGED: ${{ needs.changes.outputs.devtools }}
          WEB: ${{ needs.web.result }}
          E2E: ${{ needs.e2e.result }}
          DEVTOOLS: ${{ needs.devtools.result }}
        run: |
          status=0
          expect() {
            local want
            case "$2" in
              true) want=success ;;
              false) want=skipped ;;
              *)
                echo "::error title=ci::The path filter gave $1 '$2', expected true or false."
                status=1
                return
                ;;
            esac
            if [ "$3" != "$want" ]; then
              echo "::error title=ci::$1 was $3, expected $want."
              status=1
            fi
          }
          expect changes true "$CHANGES"
          expect web "$WEB_CHANGED" "$WEB"
          expect e2e "$WEB_CHANGED" "$E2E"
          expect devtools "$DEVTOOLS_CHANGED" "$DEVTOOLS"
          exit "$status"
