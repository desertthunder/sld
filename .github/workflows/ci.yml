# Checks pull requests once they are ready for review, and every push to main.
# Agents run `make ci` before each push, so a draft starts no job: a skipped
# required check counts as passing, which is safe only because a draft cannot
# merge. One job, `ci`, the only required status check: it filters paths, then
# runs the web steps, the devtools steps or both, and fails if any step fails.
# One job is billed once, where a job per package was billed per job.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      # On a pull request this reads the pull request's files; on a push to
      # main it compares against the commit before the push.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared_ts: &shared_ts
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - .nvmrc
              - eslint.config.js
              - prettier.config.js
              - .prettierignore
              - .github/workflows/ci.yml
            web:
              - apps/web/**
              - *shared_ts
            devtools:
              - tools/devtools/**
              - .github/workflows/comment.yml
              - *shared_ts

      - if: steps.filter.outputs.web == 'true' || steps.filter.outputs.devtools == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.filter.outputs.web == 'true' || steps.filter.outputs.devtools == 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.filter.outputs.web == 'true' || steps.filter.outputs.devtools == 'true'
        run: pnpm install --frozen-lockfile

      - name: Web lint
        if: steps.filter.outputs.web == 'true'
        run: pnpm exec prettier --check apps/web && pnpm exec eslint apps/web
      - name: Web check
        if: steps.filter.outputs.web == 'true'
        run: pnpm --filter @sld/web check
      - name: Web test
        if: steps.filter.outputs.web == 'true'
        run: pnpm --filter @sld/web test
      - name: Web build
        if: steps.filter.outputs.web == 'true'
        run: pnpm --filter @sld/web build
      # Deploy refuses a build like this, but only once a release is tagged.
      - name: Check the build serves the app shell for every path
        if: steps.filter.outputs.web == 'true'
        run: |
          build=apps/web/build
          if [[ ! -f $build/index.html ]]; then
            echo "::error title=web::$build/index.html is missing."
            exit 1
          fi
          if [[ -f $build/404.html ]]; then
            echo "::error title=web::$build/404.html exists, so Pages won't serve the app shell for deck URLs."
            exit 1
          fi

      - name: Devtools lint
        if: steps.filter.outputs.devtools == 'true'
        run: pnpm exec prettier --check tools/devtools && pnpm exec eslint tools/devtools
      - name: Devtools check
        if: steps.filter.outputs.devtools == 'true'
        run: pnpm --filter @sld/devtools check
      - name: Devtools test
        if: steps.filter.outputs.devtools == 'true'
        run: pnpm --filter @sld/devtools test
      # comment.yml runs the tool with Node alone, so run it that way once.
      - name: Dry run as comment.yml does
        if: steps.filter.outputs.devtools == 'true'
        run: |
          printf 'Review loop finished\n' > "$RUNNER_TEMP/body.md"
          node tools/devtools/src/devtools.ts pr ready --repo "$GITHUB_REPOSITORY" --pr 1 --dry-run --body-file "$RUNNER_TEMP/body.md"
