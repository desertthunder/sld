# Checks pull requests once they are ready for review, and every push to main.
# Agents run `make ci` before each push, so a draft starts no job: a skipped
# required check counts as passing, which is safe only because a draft cannot
# merge. One job, `ci`, the only required status check: it filters paths, then
# runs the web steps, the devtools steps or both, and fails if any step fails.
# One job is billed once, where a job per package was billed per job. To keep
# that one job short, the web unit tests and browser tests run at the same time
# in one step instead of in a job each, which would install everything twice.
#
# The browser tests run in Chromium only. Browsers (browsers.yml) runs them in
# Firefox or WebKit when a pull request carries that label. `ci` never runs on
# a label event: a label would start a run that skips, and a skipped `ci`
# counts as passing even after a failed run on the same head.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      # On a pull request this reads the pull request's files; on a push to
      # main it compares against the commit before the push.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared_ts: &shared_ts
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - .nvmrc
              - eslint.config.js
              - prettier.config.js
              - .prettierignore
              - .github/workflows/ci.yml
              - Makefile
            web:
              - apps/web/**
              - *shared_ts
            devtools:
              - tools/devtools/**
              - .github/workflows/comment.yml
              - *shared_ts

      - if: steps.filter.outputs.web == 'true' || steps.filter.outputs.devtools == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.filter.outputs.web == 'true' || steps.filter.outputs.devtools == 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.filter.outputs.web == 'true' || steps.filter.outputs.devtools == 'true'
        id: install
        run: pnpm install --frozen-lockfile

      - name: Web lint
        if: steps.filter.outputs.web == 'true'
        run: pnpm exec prettier --check apps/web && pnpm exec eslint apps/web
      - name: Web check
        if: steps.filter.outputs.web == 'true'
        run: pnpm --filter @sld/web check
      - name: Key the browser cache by Playwright version
        if: steps.filter.outputs.web == 'true'
        id: browsers
        run: |
          version=$(pnpm --filter @sld/web exec playwright --version | awk '{ print $2 }')
          echo "cache-key=playwright-$ImageOS-$version-chromium" >> "$GITHUB_OUTPUT"
      - name: Restore Chromium from the cache
        if: steps.filter.outputs.web == 'true'
        id: browser-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-key }}
      - name: Install Chromium and its system packages
        if: steps.filter.outputs.web == 'true' && steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @sld/web exec playwright install --with-deps chromium
      # Saved before the tests run, so a failing test doesn't cost the next run the download.
      - name: Save Chromium to the cache
        if: steps.filter.outputs.web == 'true' && steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-key }}
      - name: Install the system packages the cached Chromium needs
        if: steps.filter.outputs.web == 'true' && steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @sld/web exec playwright install-deps chromium
      # The two suites share the runner's 4 vCPUs. Alone, the browser tests took about 6 minutes and the unit tests 2,
      # so the browser tests get 3 workers (Playwright's default is 2) and the unit tests 2 (vitest's default is 3).
      # Sharing the CPUs slows the database tests, so they get 30 seconds before a timeout instead of 5 and 10.
      # Each suite writes to its own log, printed once both finish: a passing suite folded, a failing one open.
      - name: Web test and browser test, at the same time
        if: steps.filter.outputs.web == 'true'
        env:
          VITEST_MAX_WORKERS: '2'
        run: |
          unit_log="$RUNNER_TEMP/web-test.log"
          browser_log="$RUNNER_TEMP/web-browser-test.log"
          pnpm --filter @sld/web test --testTimeout=30000 --hookTimeout=30000 > "$unit_log" 2>&1 &
          unit=$!
          pnpm --filter @sld/web e2e --project=chromium --workers=3 > "$browser_log" 2>&1 &
          browser=$!
          unit_status=0
          wait "$unit" || unit_status=$?
          browser_status=0
          wait "$browser" || browser_status=$?
          report() {
            if [ "$2" -eq 0 ]; then
              echo "::group::$1 passed"
              cat "$3"
              echo "::endgroup::"
            else
              echo "::error title=web::$1 failed with exit code $2."
              cat "$3"
            fi
          }
          report 'Web test' "$unit_status" "$unit_log"
          report 'Web browser test' "$browser_status" "$browser_log"
          [ "$unit_status" -eq 0 ] && [ "$browser_status" -eq 0 ]
      - name: Web build
        if: steps.filter.outputs.web == 'true'
        run: pnpm --filter @sld/web build
      - name: Check the build serves the app shell for every path
        if: steps.filter.outputs.web == 'true'
        run: make app-shell

      # Run after a failed web step too, so one run reports both packages.
      - name: Devtools lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.filter.outputs.devtools == 'true' }}
        run: pnpm exec prettier --check tools/devtools && pnpm exec eslint tools/devtools
      - name: Devtools check
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.filter.outputs.devtools == 'true' }}
        run: pnpm --filter @sld/devtools check
      - name: Devtools test
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.filter.outputs.devtools == 'true' }}
        run: pnpm --filter @sld/devtools test
      - name: Dry run as comment.yml does
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.filter.outputs.devtools == 'true' }}
        run: make dry-run
