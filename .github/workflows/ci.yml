# Checks pull requests once they are ready for review, and every push to main.
# Agents run `make ci` before each push, so a draft starts no job: a skipped
# required check counts as passing, which is safe only because a draft cannot
# merge. One job, `ci`, the only required status check: it filters paths, then
# runs the web steps, the devtools steps or both, and fails if any step fails.
# One job is billed once, where a job per package was billed per job.
#
# The browser tests run in Chromium. A `firefox` or `webkit` label on the pull
# request adds that engine, and adding one to a ready pull request starts a run
# on its head. Any other label starts a run that skips at once, in a
# concurrency group of its own so it cancels no run in progress.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}${{ github.event.action == 'labeled' && !contains(fromJSON('["firefox", "webkit"]'), github.event.label.name) && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  ci:
    if: >-
      github.event_name != 'pull_request' || (!github.event.pull_request.draft
      && (github.event.action != 'labeled' || contains(fromJSON('["firefox", "webkit"]'), github.event.label.name)))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      # On a pull request this reads the pull request's files; on a push to
      # main it compares against the commit before the push.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared_ts: &shared_ts
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - .nvmrc
              - eslint.config.js
              - prettier.config.js
              - .prettierignore
              - .github/workflows/ci.yml
              - Makefile
            web:
              - apps/web/**
              - *shared_ts
            devtools:
              - tools/devtools/**
              - .github/workflows/comment.yml
              - *shared_ts

      - if: steps.filter.outputs.web == 'true' || steps.filter.outputs.devtools == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.filter.outputs.web == 'true' || steps.filter.outputs.devtools == 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.filter.outputs.web == 'true' || steps.filter.outputs.devtools == 'true'
        id: install
        run: pnpm install --frozen-lockfile

      - name: Web lint
        if: steps.filter.outputs.web == 'true'
        run: pnpm exec prettier --check apps/web && pnpm exec eslint apps/web
      - name: Web check
        if: steps.filter.outputs.web == 'true'
        run: pnpm --filter @sld/web check
      - name: Web test
        if: steps.filter.outputs.web == 'true'
        run: pnpm --filter @sld/web test
      - name: Choose the browsers for the web browser tests
        if: steps.filter.outputs.web == 'true'
        id: browsers
        env:
          FIREFOX: ${{ contains(github.event.pull_request.labels.*.name, 'firefox') }}
          WEBKIT: ${{ contains(github.event.pull_request.labels.*.name, 'webkit') }}
        run: |
          browsers=chromium
          if [ "$FIREFOX" = true ]; then browsers="$browsers firefox"; fi
          if [ "$WEBKIT" = true ]; then browsers="$browsers webkit"; fi
          version=$(pnpm --filter @sld/web exec playwright --version | awk '{ print $2 }')
          echo "list=$browsers" >> "$GITHUB_OUTPUT"
          echo "cache-key=playwright-$RUNNER_OS-$version-${browsers// /-}" >> "$GITHUB_OUTPUT"
      - name: Restore the browsers from the cache
        if: steps.filter.outputs.web == 'true'
        id: browser-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-key }}
      - name: Install the browsers and their system packages
        if: steps.filter.outputs.web == 'true' && steps.browser-cache.outputs.cache-hit != 'true'
        env:
          BROWSERS: ${{ steps.browsers.outputs.list }}
        run: pnpm --filter @sld/web exec playwright install --with-deps $BROWSERS
      # Saved before the tests run, so a failing test doesn't cost the next run the download.
      - name: Save the browsers to the cache
        if: steps.filter.outputs.web == 'true' && steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-key }}
      - name: Install the system packages the cached browsers need
        if: steps.filter.outputs.web == 'true' && steps.browser-cache.outputs.cache-hit == 'true'
        env:
          BROWSERS: ${{ steps.browsers.outputs.list }}
        run: pnpm --filter @sld/web exec playwright install-deps $BROWSERS
      - name: Web browser test
        if: steps.filter.outputs.web == 'true'
        env:
          BROWSERS: ${{ steps.browsers.outputs.list }}
        run: make e2e BROWSERS="$BROWSERS"
      - name: Web build
        if: steps.filter.outputs.web == 'true'
        run: pnpm --filter @sld/web build
      - name: Check the build serves the app shell for every path
        if: steps.filter.outputs.web == 'true'
        run: make app-shell

      # Run after a failed web step too, so one run reports both packages.
      - name: Devtools lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.filter.outputs.devtools == 'true' }}
        run: pnpm exec prettier --check tools/devtools && pnpm exec eslint tools/devtools
      - name: Devtools check
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.filter.outputs.devtools == 'true' }}
        run: pnpm --filter @sld/devtools check
      - name: Devtools test
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.filter.outputs.devtools == 'true' }}
        run: pnpm --filter @sld/devtools test
      - name: Dry run as comment.yml does
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.filter.outputs.devtools == 'true' }}
        run: make dry-run
