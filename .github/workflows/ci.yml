# Checks pull requests once they are ready for review, and every push to main.
# Agents run `make ci` before each push, so a draft starts no job: a skipped
# required check counts as passing, which is safe only because a draft cannot
# merge.
#
# Two jobs run side by side: `checks` (lockfile, lint, type check, unit tests,
# build, app shell, dry run) and `browser` (the browser tests, the slowest
# part). Each filters paths itself and skips the steps for a package the change
# doesn't touch, so neither job skips on a ready pull request. A third job,
# `ci`, the only required status check, waits for both and passes only if both
# succeeded. It runs even when one failed or the run was cancelled, so it fails
# rather than skips; it skips only on a draft, along with the others.
#
# The browser tests run in Chromium only. Browsers (browsers.yml) runs them in
# Firefox or WebKit when a pull request carries that label. `ci` never runs on
# a label event: a label would start a run that skips, and a skipped `ci`
# counts as passing even after a failed run on the same head.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      # On a pull request this reads the pull request's files; on a push to
      # main it compares against the commit before the push.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: &filters |
            shared_ts: &shared_ts
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - .nvmrc
              - eslint.config.js
              - prettier.config.js
              - .prettierignore
              - .github/workflows/ci.yml
              - Makefile
            web:
              - apps/web/**
              - *shared_ts
            devtools:
              - tools/devtools/**
              - .github/workflows/comment.yml
              - *shared_ts

      - if: steps.filter.outputs.web == 'true' || steps.filter.outputs.devtools == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.filter.outputs.web == 'true' || steps.filter.outputs.devtools == 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.filter.outputs.web == 'true' || steps.filter.outputs.devtools == 'true'
        id: install
        run: pnpm install --frozen-lockfile

      - name: Web lint
        if: steps.filter.outputs.web == 'true'
        run: pnpm exec prettier --check apps/web && pnpm exec eslint apps/web
      - name: Web check
        if: steps.filter.outputs.web == 'true'
        run: pnpm --filter @sld/web check
      - name: Web test
        if: steps.filter.outputs.web == 'true'
        run: pnpm --filter @sld/web test
      - name: Web build
        if: steps.filter.outputs.web == 'true'
        run: pnpm --filter @sld/web build
      - name: Check the build serves the app shell for every path
        if: steps.filter.outputs.web == 'true'
        run: make app-shell

      # Run after a failed web step too, so one run reports both packages.
      - name: Devtools lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.filter.outputs.devtools == 'true' }}
        run: pnpm exec prettier --check tools/devtools && pnpm exec eslint tools/devtools
      - name: Devtools check
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.filter.outputs.devtools == 'true' }}
        run: pnpm --filter @sld/devtools check
      - name: Devtools test
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.filter.outputs.devtools == 'true' }}
        run: pnpm --filter @sld/devtools test
      - name: Dry run as comment.yml does
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.filter.outputs.devtools == 'true' }}
        run: make dry-run

  browser:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: *filters

      - if: steps.filter.outputs.web == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.filter.outputs.web == 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.filter.outputs.web == 'true'
        run: pnpm install --frozen-lockfile

      - name: Key the browser cache by Playwright version
        if: steps.filter.outputs.web == 'true'
        id: browsers
        run: |
          version=$(pnpm --filter @sld/web exec playwright --version | awk '{ print $2 }')
          echo "cache-key=playwright-$ImageOS-$version-chromium" >> "$GITHUB_OUTPUT"
      - name: Restore Chromium from the cache
        if: steps.filter.outputs.web == 'true'
        id: browser-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-key }}
      - name: Install Chromium and its system packages
        if: steps.filter.outputs.web == 'true' && steps.browser-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @sld/web exec playwright install --with-deps chromium
      # Saved before the tests run, so a failing test doesn't cost the next run the download.
      - name: Save Chromium to the cache
        if: steps.filter.outputs.web == 'true' && steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-key }}
      - name: Install the system packages the cached Chromium needs
        if: steps.filter.outputs.web == 'true' && steps.browser-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @sld/web exec playwright install-deps chromium
      - name: Web browser test
        if: steps.filter.outputs.web == 'true'
        run: make e2e BROWSERS=chromium

  # always() rather than !cancelled(): a cancelled run must fail `ci`, because
  # a skipped `ci` would count as passing.
  ci:
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    needs: [checks, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Pass only if both jobs succeeded
        env:
          CHECKS: ${{ needs.checks.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          if [ "$CHECKS" != success ] || [ "$BROWSER" != success ]; then
            echo "::error title=ci::checks: $CHECKS, browser: $BROWSER."
            exit 1
          fi
