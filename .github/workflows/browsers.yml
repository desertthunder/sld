# Runs the web app's browser tests in Firefox or WebKit when a ready pull
# request carries a `firefox` or `webkit` label. CI (ci.yml) runs them in
# Chromium on every pull request; this workflow adds the other engines on
# request, so a pull request pays for them only when it needs them.
#
# Adding a label, pushing, or marking the draft ready runs every engine the pull
# request is labeled with. GitHub can't filter label events by name, so any
# other label runs them again too: a run that skipped would replace a failed
# `browsers` check on the same head. A pull request with neither label, or one
# that changes none of the paths below, starts no job, which is safe because
# `browsers` is not the required check.
name: Browsers

on:
  pull_request:
    types: [labeled, synchronize, ready_for_review]
    # ci.yml's web filter, with this workflow in place of ci.yml.
    paths:
      - apps/web/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .nvmrc
      - eslint.config.js
      - prettier.config.js
      - .prettierignore
      - .github/workflows/browsers.yml
      - Makefile

permissions:
  contents: read

concurrency:
  group: browsers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browsers:
    if: >-
      !github.event.pull_request.draft && (contains(github.event.pull_request.labels.*.name, 'firefox')
      || contains(github.event.pull_request.labels.*.name, 'webkit'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Choose the labeled browsers
        id: browsers
        env:
          FIREFOX: ${{ contains(github.event.pull_request.labels.*.name, 'firefox') }}
          WEBKIT: ${{ contains(github.event.pull_request.labels.*.name, 'webkit') }}
        run: |
          browsers=()
          if [ "$FIREFOX" = true ]; then browsers+=(firefox); fi
          if [ "$WEBKIT" = true ]; then browsers+=(webkit); fi
          version=$(pnpm --filter @sld/web exec playwright --version | awk '{ print $2 }')
          echo "list=${browsers[*]}" >> "$GITHUB_OUTPUT"
          echo "cache-key=playwright-$ImageOS-$version-$(IFS=-; echo "${browsers[*]}")" >> "$GITHUB_OUTPUT"
      - name: Restore the browsers from the cache
        id: browser-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-key }}
      - name: Install the browsers and their system packages
        if: steps.browser-cache.outputs.cache-hit != 'true'
        env:
          BROWSERS: ${{ steps.browsers.outputs.list }}
        run: pnpm --filter @sld/web exec playwright install --with-deps $BROWSERS
      # Saved before the tests run, so a failing test doesn't cost the next run the download.
      - name: Save the browsers to the cache
        if: steps.browser-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-key }}
      - name: Install the system packages the cached browsers need
        if: steps.browser-cache.outputs.cache-hit == 'true'
        env:
          BROWSERS: ${{ steps.browsers.outputs.list }}
        run: pnpm --filter @sld/web exec playwright install-deps $BROWSERS
      - name: Web browser test
        env:
          BROWSERS: ${{ steps.browsers.outputs.list }}
        run: make e2e BROWSERS="$BROWSERS"
